name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Load rbenv into PATH
            export HOME=/home/ubuntu
            export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH"
            eval "$(rbenv init -)"

            cd /home/ubuntu/apps/soul-erp

            echo "📦 Pulling latest code..."
            git pull origin main

            echo "💎 Installing gems..."
            bundle install --without development test

            echo "🗄️ Running migrations..."
            RAILS_ENV=production bundle exec rails db:migrate

            echo "🎨 Precompiling assets..."
            RAILS_ENV=production bundle exec rails assets:precompile

            if ! command -v google-chrome &> /dev/null && ! command -v google-chrome-stable &> /dev/null && ! command -v chromium &> /dev/null && ! command -v chromium-browser &> /dev/null; then
              echo "📦 Installing Google Chrome for PDF exports..."
              wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb && sudo apt-get update -y && sudo apt-get install -y /tmp/chrome.deb && rm -f /tmp/chrome.deb || (sudo apt-get install -y chromium-browser)
            fi

            echo "🔤 Ensuring system-wide Malayalam & Indic fonts..."
            sudo apt-get update -y && sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-indic fonts-smc fonts-smc-gayathri fonts-smc-manjari fontconfig
            mkdir -p ~/.local/share/fonts
            cp app/assets/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
            fc-cache -f ~/.local/share/fonts || true

            echo "🔄 Restarting app..."
            sudo killall -9 -q chrome chromium chromium-browser google-chrome 2>/dev/null || true
            sudo systemctl restart soul-erp

            echo "✅ Deployed successfully! https://beya.in"